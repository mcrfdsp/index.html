<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monster Maker – Constança Sousa Pinto</title>
<link rel="stylesheet" href="style.css">
<script src="theme.js"></script>
<style>
.inner main.mm-main{padding-top:1vh;padding-bottom:30px}
.mm-title{text-align:center;font-size:clamp(22px,3vw,38px);font-weight:500;text-transform:none;letter-spacing:-.02em;margin:1vh 0 3vh}
.mm{display:grid;grid-template-columns:210px auto 190px;gap:28px;justify-content:center;align-items:start}
.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.arrow{background:none;border:0;color:inherit;font:inherit;font-size:22px;cursor:pointer;padding:0 8px;line-height:1}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.opt{position:relative;aspect-ratio:1;border:1.5px solid currentColor;border-radius:12px;background:transparent;color:inherit;padding:8px;cursor:pointer;overflow:hidden}
.opt.light{background:#f1f1f1}
.opt.on{outline:3px solid currentColor;outline-offset:2px}
.opt svg{width:100%;height:100%;display:block}
.opt .sw{position:absolute;inset:0}
.stage{position:relative;height:min(68vh,640px);aspect-ratio:4/5;border:2px solid currentColor;border-radius:34px;overflow:hidden}
.stage .bg{position:absolute;inset:0}
.stage .monster{position:absolute;left:15%;top:50%;width:70%;aspect-ratio:1;margin-top:-35%}
.stage .monster svg{width:100%;height:100%;display:block;overflow:visible}
.stage .monster.pop{animation:pop .28s ease-out}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
.btn{display:block;width:100%;border:1.5px solid currentColor;background:transparent;color:inherit;font:inherit;text-transform:uppercase;padding:12px 14px;border-radius:999px;cursor:pointer;margin-bottom:10px}
.btn:hover:not(:disabled){background:var(--fg);color:var(--bg)}
.btn:disabled{opacity:.3;cursor:default}
.row{display:flex;gap:10px}
.row .btn{padding:12px 8px}
.btn.solid{background:var(--fg);color:var(--bg)}
.btn.solid:hover:not(:disabled){background:transparent;color:var(--fg)}
.note{font-size:11px;text-transform:none;opacity:.8;min-height:1.2em}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:10;padding:16px}
.modal[hidden]{display:none}
.card{position:relative;background:var(--bg);color:var(--fg);border:1.5px solid currentColor;border-radius:28px;padding:20px;width:100%;max-width:360px;max-height:94vh;overflow:auto}
.card img{width:100%;max-height:44vh;object-fit:contain;border-radius:16px;display:block;margin:6px 0 16px}
.card .x{position:absolute;top:10px;right:14px;background:none;border:0;color:inherit;font-size:26px;line-height:1;cursor:pointer}
.card h2{font-size:13px;font-weight:500;text-align:center;margin-top:2px}
.card .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card .grid .btn{margin:0}
.card .hint{margin-top:12px;font-size:11px;text-align:center;text-transform:none;min-height:1.2em;opacity:.8}
@media(max-width:860px){
  .mm{grid-template-columns:1fr;justify-items:center;gap:20px}
  .stage{height:auto;width:min(100%,360px)}
  .left{order:2;width:100%;max-width:360px}.right{order:3;width:100%;max-width:360px}
  .opts{grid-template-columns:repeat(4,1fr)}
  .inner main.mm-main{padding:0 16px 30px}
}
</style>
</head>
<body class="inner">
<div class="layer">
  <header class="nav">
    <a class="nav-left" href="contact.html">Contact</a>
    <a class="brand" href="index.html">Constança Sousa Pinto<br>Product Designer</a>
    <div class="nav-right"><a href="about.html">About me</a><a href="index.html">Projects</a></div>
  </header>
  <main class="mm-main">
    <h1 class="mm-title">Monster Maker</h1>
    <div class="mm">
      <div class="left">
        <div class="panel-head">
          <button class="arrow" id="prev" aria-label="Anterior">‹</button>
          <span id="catname">Shapes</span>
          <button class="arrow" id="next" aria-label="Seguinte">›</button>
        </div>
        <div class="opts" id="opts"></div>
      </div>
      <div class="stage" id="stage"><div class="bg" id="bg"></div><div class="monster" id="monster"></div></div>
      <div class="right">
        <button class="btn" id="save">Save your monster</button>
        <button class="btn solid" id="realize">Release your monster</button>
        <div class="row"><button class="btn" id="undo">← Back</button><button class="btn" id="redo">Next →</button></div>
        <p class="note" id="note"></p>
      </div>
    </div>
  </main>
</div>
<div class="modal" id="modal" hidden>
  <div class="card">
    <button class="x" id="close" aria-label="Fechar">×</button>
    <h2>Your monster</h2>
    <img id="shot" alt="O teu monstro">
    <div class="grid">
      <button class="btn" id="share" hidden>Share…</button>
      <button class="btn" id="wa">WhatsApp</button>
      <button class="btn" id="gm">Gmail</button>
      <button class="btn" id="dl">Download</button>
    </div>
    <p class="hint" id="hint"></p>
  </div>
</div>
<script>
// ---------- DADOS ----------
const COLORS=['#FFDD57','#00BF63','#FF3131','#0049AD','#FF751F','#FF66C4','#B0B0B0','#38B6FF'];
const BGS=[ // img = ficheiro na pasta images/ ; c = cor de reserva enquanto não puseres a foto
  {c:'#eeeeee'},{img:'bg-2.jpg',c:'#9fd0f0'},{img:'bg-3-2.jpg',c:'#b9b9b3'},{img:'bg-4-2.jpg',c:'#4aa39b'},
  {img:'bg-5-2.jpg',c:'#b5533c'},{img:'bg-6-2.jpg',c:'#6aa7c9'},{img:'bg-7-2.jpg',c:'#a9754a'},{img:'bg-8-2.jpg',c:'#c9a26b'}];
const CATS=[{k:'shape',n:'Shapes'},{k:'color',n:'Color'},{k:'eyes',n:'Eyes'},{k:'mouth',n:'Mouth'},{k:'bg',n:'Background'}];
const INK='#111', ST=`stroke="${INK}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"`, ST2=`stroke="${INK}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"`;

const wavy=(f,n=140)=>{let d='';for(let i=0;i<n;i++){const a=i/n*Math.PI*2,r=f(a);d+=(i?'L':'M')+(100+r*Math.cos(a)).toFixed(1)+' '+(100+r*Math.sin(a)).toFixed(1)}return d+'Z'};
const pixel=c=>{let s='';for(let y=0;y<16;y++)for(let x=0;x<16;x++){const cx=25+x*10,cy=25+y*10;if(Math.hypot(cx-100,cy-100)<80)s+=`<rect x="${cx-5}" y="${cy-5}" width="10" height="10" fill="${c}" stroke="${c}" stroke-width=".6"/>`}return s};

// cada forma: draw(cor) + posição da cara {ey: altura dos olhos, my: altura da boca, s: escala}
const SHAPES=[
 {draw:c=>`<circle cx="100" cy="100" r="80" fill="${c}"/>`,face:{ey:85,my:130,s:1}},
 {draw:c=>`<path d="M20 180V100a80 80 0 0 1 160 0V180q0 10-10 10H30q-10 0-10-10Z" fill="${c}"/>`,face:{ey:95,my:140,s:1}},
 {draw:c=>`<rect x="25" y="25" width="150" height="150" rx="38" fill="${c}"/>`,face:{ey:85,my:130,s:1}},
 {draw:c=>`<path d="${wavy(a=>76+6*Math.cos(a*10))}" fill="${c}"/>`,face:{ey:85,my:130,s:1}},
 {draw:c=>`<rect x="30" y="8" width="140" height="106" rx="48" fill="${c}"/><rect x="30" y="86" width="140" height="106" rx="48" fill="${c}"/>`,face:{ey:58,my:140,s:.95}},
 {draw:c=>pixel(c),face:{ey:85,my:130,s:1}},
 {draw:c=>`<path d="M30 170C30 90 55 30 100 30C145 30 170 90 170 170C170 190 150 190 135 178C118 166 82 166 65 178C50 190 30 190 30 170Z" fill="${c}"/>`,face:{ey:85,my:122,s:1}},
 {draw:c=>`<ellipse cx="100" cy="100" rx="54" ry="88" fill="${c}"/>`,face:{ey:80,my:128,s:.8}}];

const eyeWrap=fn=>()=>[-1,1].map(s=>`<g transform="translate(${s*25} 0)">${fn(s)}</g>`).join('');
const ball=(r,extra='')=>`<circle r="${r}" fill="#fff" ${ST}/>${extra}`;
const EYES=[
 eyeWrap(()=>ball(15,`<path d="M-15 0A15 15 0 0 1 15 0Z" fill="${INK}"/>`)),
 eyeWrap(s=>ball(19,`<circle cx="${s<0?-5:6}" cy="${s<0?-4:6}" r="6" fill="${INK}"/>`)),
 eyeWrap(()=>ball(17,`<circle r="2.2" fill="${INK}"/>`)),
 eyeWrap(()=>ball(16,`<circle cx="5" cy="4" r="8" fill="${INK}"/><circle cx="3" cy="2" r="2.5" fill="#fff"/>`)),
 eyeWrap(()=>ball(16,`<circle r="11" fill="${INK}"/><circle cx="-4" cy="-4" r="3.2" fill="#fff"/>`)),
 eyeWrap(()=>`<path d="M-16 -3H16A16 16 0 0 1 -16 -3Z" fill="#fff" ${ST}/><circle cy="5" r="6.5" fill="${INK}"/><circle cx="-2" cy="3" r="2" fill="#fff"/>`),
 eyeWrap(s=>ball(15,`<circle cx="${-s*3}" cy="3" r="6" fill="${INK}"/><path d="M${s*18} -11L${-s*18} 2" stroke="${INK}" stroke-width="6" stroke-linecap="round"/>`)),
 eyeWrap(()=>`<circle r="16" fill="${INK}" ${ST}/><circle r="3" fill="#fff"/>`)];

const halo=d=>`<path d="${d}" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round"/><path d="${d}" fill="none" ${ST}/>`;
const MOUTHS=[
 ()=>halo('M-24 -2Q0 16 24 -2'),
 ()=>`<path d="M-15 16Q-15 -16 0 -16Q15 -16 15 16Z" fill="${INK}" ${ST}/><rect x="-5" y="-12" width="10" height="7" rx="2" fill="#fff"/>`,
 ()=>`<rect x="-26" y="-10" width="52" height="22" rx="9" fill="#fff" ${ST}/><path d="M-13 -10V12M0 -10V12M13 -10V12M-26 1H26" fill="none" ${ST2}/>`,
 ()=>`<ellipse rx="17" ry="20" fill="${INK}" ${ST}/><ellipse cy="12" rx="9" ry="6" fill="#fff"/><rect x="-5" y="-17" width="10" height="6" rx="2" fill="#fff"/>`,
 ()=>halo('M-24 8Q0 -10 24 8'),
 ()=>`<path d="M-20 -6H20A20 20 0 0 1 -20 -6Z" fill="${INK}" ${ST}/><ellipse cx="6" cy="14" rx="9" ry="8" fill="#fff" ${ST}/>`,
 ()=>`<path d="M-26 -6Q0 4 26 -6Q22 22 0 22Q-22 22 -26 -6Z" fill="#fff" ${ST}/><path d="M-22 4Q0 12 22 4" fill="none" ${ST2}/>`,
 ()=>`<path d="M-20 -8Q0 -16 20 -8Q24 8 8 10Q6 22 -2 22Q-8 12 -20 -8Z" fill="#fff" ${ST}/>`];

// ---------- ESTADO ----------
let S={shape:null,color:null,eyes:null,mouth:null,bg:null}, hist=[{...S}], hi=0, cat=0;
const $=id=>document.getElementById(id);
const bgStyle=b=>(b.img?`url(images/${b.img}) center/cover no-repeat,`:'')+b.c;

function monsterSVG(){
  const sh=SHAPES[S.shape], f=sh?sh.face:{ey:85,my:130,s:1};
  const col=S.color!==null?COLORS[S.color]:'#B0B0B0';
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">`+
    (sh?sh.draw(col):'')+
    (S.eyes!==null?`<g transform="translate(100 ${f.ey}) scale(${f.s})">${EYES[S.eyes]()}</g>`:'')+
    (S.mouth!==null?`<g transform="translate(100 ${f.my}) scale(${f.s})">${MOUTHS[S.mouth]()}</g>`:'')+`</svg>`;
}
function refresh(pop){ $('note').textContent='';
  $('bg').style.background=S.bg!==null?bgStyle(BGS[S.bg]):'transparent';
  $('monster').innerHTML=monsterSVG();
  if(pop){const m=$('monster');m.classList.remove('pop');void m.offsetWidth;m.classList.add('pop')}
  document.querySelectorAll('.opt').forEach((b,i)=>b.classList.toggle('on',S[CATS[cat].k]===i));
  $('undo').disabled=hi===0; $('redo').disabled=hi===hist.length-1;
}
function tiles(){
  const k=CATS[cat].k; $('catname').textContent=CATS[cat].n; $('opts').innerHTML='';
  for(let i=0;i<8;i++){
    const b=document.createElement('button'); b.className='opt'; b.setAttribute('aria-label',CATS[cat].n+' '+(i+1));
    if(k==='shape') b.innerHTML=`<svg viewBox="0 0 200 200">${SHAPES[i].draw('currentColor')}</svg>`;
    if(k==='color') b.innerHTML=`<span class="sw" style="background:${COLORS[i]}"></span>`;
    if(k==='eyes'){b.classList.add('light');b.innerHTML=`<svg viewBox="-50 -30 100 60">${EYES[i]()}</svg>`}
    if(k==='mouth'){b.classList.add('light');b.innerHTML=`<svg viewBox="-36 -30 72 60">${MOUTHS[i]()}</svg>`}
    if(k==='bg') b.innerHTML=`<span class="sw" style="background:${bgStyle(BGS[i])}"></span>`;
    b.onclick=()=>{S={...S,[k]:S[k]===i?null:i};hist=hist.slice(0,hi+1);hist.push({...S});hi++;refresh(k!=='bg')};
    $('opts').appendChild(b);
  }
  refresh();
}
const go=d=>{cat=(cat+d+CATS.length)%CATS.length;tiles()};
$('prev').onclick=()=>go(-1); $('next').onclick=()=>go(1);
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')go(-1);if(e.key==='ArrowRight')go(1)});
$('undo').onclick=()=>{if(hi>0){hi--;S={...hist[hi]};refresh()}};
$('redo').onclick=()=>{if(hi<hist.length-1){hi++;S={...hist[hi]};refresh()}};

// ---------- GUARDAR / PARTILHAR ----------
let blob=null;
const MSG='Olha o monstro que fiz! 👾';
function makeImage(cb){
  const W=800,H=1000,cv=document.createElement('canvas');cv.width=W;cv.height=H;const x=cv.getContext('2d');
  const finish=()=>{
    const img=new Image();
    img.onload=()=>{
      x.drawImage(img,120,220,560,560);
      try{cv.toBlob(b=>cb(b))}catch(e){cb(null)}
    };
    img.onerror=()=>cb(null);
    img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(monsterSVG());
  };
  const fill=c=>{x.fillStyle=c;x.fillRect(0,0,W,H)};
  const b=S.bg!==null?BGS[S.bg]:null;
  if(!b){fill(getComputedStyle(document.querySelector('.layer')).backgroundColor);finish();return}
  fill(b.c);
  if(!b.img){finish();return}
  const im=new Image();
  im.onload=()=>{const k=Math.max(W/im.width,H/im.height);x.drawImage(im,(W-im.width*k)/2,(H-im.height*k)/2,im.width*k,im.height*k);finish()};
  im.onerror=finish; im.src='images/'+b.img;
}
const hint=t=>$('hint').textContent=t;
const getFile=()=>new File([blob],'my-monster.png',{type:'image/png'});
// copia a imagem para colares (Cmd+V) na conversa
function copyImage(){
  try{navigator.clipboard.write([new ClipboardItem({'image/png':blob})])
    .then(()=>hint('Imagem copiada! Cola-a na mensagem com Cmd+V (ou Ctrl+V).'))
    .catch(()=>hint('Descarrega a imagem e anexa-a à mensagem.'))}
  catch(e){hint('Descarrega a imagem e anexa-a à mensagem.')}
}
$('save').onclick=()=>makeImage(b=>{
  if(!b){alert('Para guardar o monstro, abre o site pelo link online (GitHub Pages).');return}
  blob=b; $('shot').src=URL.createObjectURL(b); hint('');
  $('share').hidden=!(navigator.canShare&&navigator.canShare({files:[getFile()]}));
  $('modal').hidden=false;
});
$('close').onclick=()=>$('modal').hidden=true;
$('modal').onclick=e=>{if(e.target.id==='modal')$('modal').hidden=true};
$('share').onclick=()=>navigator.share({files:[getFile()],text:MSG}).catch(()=>{});
$('dl').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='my-monster.png';a.click()};
$('wa').onclick=()=>{copyImage();window.open('https://wa.me/?text='+encodeURIComponent(MSG+' '+location.href),'_blank')};
$('gm').onclick=()=>{copyImage();window.open('https://mail.google.com/mail/?view=cm&fs=1&su='+encodeURIComponent('O meu monstro')+'&body='+encodeURIComponent(MSG+'\n'+location.href),'_blank')};
tiles();
// ---------- REALIZE: este monstro passa a ser o da página principal ----------
$('realize').onclick=()=>{
  if(S.shape===null){$('note').textContent='Pick a shape first.';return}
  try{localStorage.setItem('monster',JSON.stringify({shape:S.shape,color:S.color,eyes:S.eyes,mouth:S.mouth}))}catch(e){}
  location.href='index.html';
};
</script>
</body>
</html>
